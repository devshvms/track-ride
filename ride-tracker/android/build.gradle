// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Workaround for plugins using the deprecated 'proguard-android.txt'
subprojects {
    afterEvaluate { proj ->
        if (proj.hasProperty('android')) {
            proj.android.buildTypes.all { buildType ->
                def files = buildType.proguardFiles
                def toRemove = files.findAll { it.name == 'proguard-android.txt' }
                if (!toRemove.isEmpty()) {
                    files.removeAll(toRemove)
                    files.add(proj.android.getDefaultProguardFile('proguard-android-optimize.txt'))
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
