<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="settings-container">
  <ng-container *ngIf="settings$ | async as settings">
    
    <ion-list-header>
      <ion-label>General</ion-label>
    </ion-list-header>

    <ion-list inset="true">
      <ion-item>
        <ion-label>Units</ion-label>
        <ion-select [value]="settings.units" (ionChange)="onSelectChange('units', $event)">
          <ion-select-option value="km">Kilometers</ion-select-option>
          <ion-select-option value="miles">Miles</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label>Auto-Pause</ion-label>
        <ion-toggle [checked]="settings.autoPause.enabled" 
                    (ionChange)="onToggleChange('autoPauseEnabled', $event)">
        </ion-toggle>
      </ion-item>
    </ion-list>

    <ion-list-header>
      <ion-label>Account & Sync</ion-label>
    </ion-list-header>

    <div class="auth-section">
      <ng-container *ngIf="user$ | async as user; else loginBtn">
        <ion-avatar>
          <img [src]="user.photoUrl || 'assets/default-avatar.png'" alt="avatar" />
        </ion-avatar>
        <ion-label>
          <h2>{{ user.name }}</h2>
          <p>{{ user.email }}</p>
        </ion-label>
        <ion-button fill="outline" color="danger" (click)="logout()">Logout</ion-button>
        <ion-list inset="true">
          <ion-item>
            <ion-label>Auto-sync Rides</ion-label>
            <ion-toggle [checked]="settings.syncWithGoogle" 
                        (ionChange)="onToggleChange('syncWithGoogle', $event)">
            </ion-toggle>
          </ion-item>
      
          <ion-item lines="none">
            <ion-label>
              <h3>Sync Status</h3>
              <p *ngIf="lastSynced$ | async as last">Last synced: {{ last | date:'short' }}</p>
            </ion-label>
            
            <div slot="end">
              <ion-spinner *ngIf="(syncStatus$ | async) === 'syncing'"></ion-spinner>
              <ion-button *ngIf="(syncStatus$ | async) !== 'syncing'" 
                          fill="clear" (click)="triggerSync()">
                <ion-icon name="sync-outline" slot="icon-only"></ion-icon>
              </ion-button>
            </div>
          </ion-item>
        </ion-list>
      </ng-container>

      <ng-template #loginBtn>
        <ion-button class="google-btn" (click)="login()">
          <ion-icon slot="start" name="logo-google"></ion-icon>
          Sign in with Google
        </ion-button>
        <p class="ion-text-center ion-padding-horizontal">
          Sign in to sync your rides with Google Drive.
        </p>
      </ng-template>
    </div>

    <div class="version-info">
      <p>Ride Tracker v1.0.0</p>
    </div>

  </ng-container>
</ion-content>
