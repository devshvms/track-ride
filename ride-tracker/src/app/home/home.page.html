<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Ride Tracker</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- Show Summary ONLY when in RIDE_SUMMARY state -->
  @if ((currentState$ | async) === RideState.RIDE_SUMMARY) {
  <app-ride-summary></app-ride-summary>
  }

  @else {

  <div class="dashboard-container" *ngIf="currentState$ | async as state">

    <!-- Stats Display (Visible during tracking or pause) -->
    <ng-container *ngIf="state !== RideState.IDLE">
      <div class="stats-grid" *ngIf="currentRide$ | async as ride">
        <ion-card class="stat-card">
          <ion-card-subtitle>Speed</ion-card-subtitle>
          <ion-card-title>{{ (ride.points[ride.points.length-1]?.speed || 0) * 3.6 | number:'1.1-1' }}
            km/h</ion-card-title>
        </ion-card>

        <ion-card class="stat-card">
          <ion-card-subtitle>Distance</ion-card-subtitle>
          <ion-card-title>{{ ride.totalDistance / 1000 | number:'1.2-2' }} km</ion-card-title>
        </ion-card>
      </div>
    </ng-container>

    <!-- Main Action Buttons -->
    <div class="action-center">
      <!-- IDLE State: Big Start Button -->
      <ion-button *ngIf="state === RideState.IDLE" size="large" expand="block" shape="round" (click)="startRide()">
        <ion-icon slot="start" name="play"></ion-icon>
        START RIDE
      </ion-button>

      <!-- TRACKING State: Pause/Stop -->
      <div class="tracking-actions" *ngIf="state === RideState.TRACKING">
        <ion-button color="warning" (click)="pauseRide()">
          <ion-icon name="pause"></ion-icon>
        </ion-button>
        <ion-button color="danger" (click)="stopRide()">
          <ion-icon name="stop"></ion-icon>
        </ion-button>
      </div>

      <!-- PAUSED State: Resume/Stop -->
      <div class="tracking-actions" *ngIf="state === RideState.PAUSED || state === RideState.AUTO_PAUSED">
        <ion-button color="success" (click)="resumeRide()">
          <ion-icon name="play"></ion-icon>
        </ion-button>
        <ion-button color="danger" (click)="stopRide()">
          <ion-icon name="stop"></ion-icon>
        </ion-button>
      </div>
    </div>


    <!-- State Indicator for Auto-Pause -->
    <ion-chip *ngIf="state === RideState.AUTO_PAUSED" color="warning">
      <ion-label>Auto-Paused (Waiting for GPS/Movement)</ion-label>
    </ion-chip>

  </div>
  }
</ion-content>
